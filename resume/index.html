<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua Meeks — Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF8F4;
    --ink: #2B2926;
    --ink-soft: #55504A;
    --hairline: #DFDAD1;
    --navy: #1B3A5C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Source Sans 3', sans-serif;
    line-height: 1.6;
  }

  .top-bar {
    width: 100%;
    height: 16px;
    background: var(--navy);
    display: block;
  }

  .button-row {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    padding: 2rem 1.5rem 0;
  }

  .btn {
    display: inline-block;
    border: 3px solid var(--navy);
    border-radius: 8px;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    letter-spacing: 0.02em;
    text-decoration: none;
    padding: 0.7rem 2.25rem;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .btn:hover {
    background: var(--navy);
    color: var(--cream);
  }

  h1 {
    font-family: 'Libre Baskerville', serif;
    font-weight: 700;
    font-size: clamp(1.75rem, 4vw, 2.75rem);
    text-align: center;
    color: var(--ink);
    padding: 2rem 1.5rem 2rem;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  .pdf-embed {
    width: 100%;
    height: 1100px;
    border: 3px solid var(--navy);
    border-radius: 8px;
    display: block;
  }

  .pdf-fallback {
    text-align: center;
    padding: 2rem;
  }

  .pdf-fallback a {
    color: var(--navy);
    font-weight: 600;
  }
</style>
</head>
<body>

  <div class="top-bar"></div>

  <nav class="button-row">
    <a class="btn" href="../index.html">Home</a>
  </nav>

  <h1>Resume</h1>

  <main>
    <iframe
      class="pdf-embed"
      src="JoshMeeksResume.pdf"
      title="Joshua Meeks Resume">
      <p class="pdf-fallback">Your browser doesn't support embedded PDFs.
         <a href="JoshMeeksResume.pdf">Download the resume instead.</a>
      </p>
    </iframe>
  </main>

</body>
</html>
